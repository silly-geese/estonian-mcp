# estonian-mcp behind nginx, with Let's Encrypt certificates.
#
# First run:
#   cp .env.example .env      # then edit DOMAIN / LETSENCRYPT_EMAIL
#   ./deploy/init-letsencrypt.sh
#   docker compose up -d
#
# See deploy/README.md for token management and troubleshooting.

name: estonian-mcp

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ESTNLTK_MCP_TRANSPORT: http
      # nginx does the real, per-client bearer auth. This token guards
      # only the nginx->app hop: it keeps the container from being an
      # open server if the network is ever misconfigured, and it keeps
      # the app in bearer mode so /.well-known/mcp/server-card.json
      # still advertises `authentication.required: true`. Public mode
      # would advertise "no auth", which stops being true once nginx
      # is the thing demanding a token.
      ESTNLTK_MCP_AUTH_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      # Every request now arrives under that one token, so the app's
      # per-token limiter (server.py:_RateLimiter) would throttle all
      # clients as a single group. nginx owns the real quota; keep this
      # high enough to stay out of the way but low enough to still cap
      # a runaway loop.
      ESTNLTK_MCP_RATE_LIMIT_PER_MINUTE: "100000"
      HOST: "0.0.0.0"
      PORT: "8081"
    # expose, not ports: reachable only from the `edge` network, never
    # published to the host.
    expose: ["8081"]
    volumes:
      - metrics:/data
    networks: [edge]

  nginx:
    build:
      context: ./deploy/nginx
    restart: unless-stopped
    depends_on: [app]
    # Host-side ports only; nginx still listens on 80 and 443 inside the
    # container. Override for local testing, where 80 and 443 are
    # usually taken. Let's Encrypt always connects to the PUBLIC port 80
    # for the HTTP-01 challenge, so a real certificate needs HTTP_PORT=80
    # unless something in front forwards it.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      # Read by 19-https-port-suffix.envsh, which turns it into the
      # HTTPS_PORT_SUFFIX that the redirect in the template uses. Must
      # match the host-side port above or the redirect points nowhere.
      HTTPS_PORT: ${HTTPS_PORT:-443}
      # The official image's envsubst step would otherwise blank every
      # nginx runtime variable ($host, $remote_addr, $mcp_client, ...)
      # in the template. This filter restricts substitution to ours.
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|INTERNAL_TOKEN|HTTPS_PORT_SUFFIX)$$"
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      # Directory, not the tokens.map file itself. A single-file bind
      # mount breaks in two ways: Docker silently creates a DIRECTORY at
      # the source path when the file does not exist yet, which then
      # fails to mount onto a file, and an editor that replaces the file
      # rather than writing in place changes the inode, so the container
      # keeps seeing the old content and a reload picks up nothing.
      - ./deploy/nginx/secrets:/etc/nginx/secrets:ro
      - ./deploy/letsencrypt/conf:/etc/letsencrypt:ro
      - ./deploy/letsencrypt/www:/var/www/certbot:ro
    networks: [edge]

  # Renewal loop. Certificates are valid 90 days and certbot renews at
  # 30 days remaining, so a twice-daily check has a very wide margin.
  # nginx picks the new files up via its own 6-hourly reload (see
  # deploy/nginx/reload-loop.sh) - certbot cannot signal across the
  # container boundary without the Docker socket, which is not worth
  # handing out for this.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./deploy/letsencrypt/conf:/etc/letsencrypt
      - ./deploy/letsencrypt/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 43200 & wait $${!};
      done'

volumes:
  metrics:

networks:
  edge:
